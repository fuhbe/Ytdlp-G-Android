name: Visual-only Liquid Glass APK
on:
  push:
    branches: [visual/liquid-glass-0.6.3]
    paths: ['minimal/**', 'docs/visual-glass/**', '.github/workflows/visual-liquid-glass.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-glass-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            minimal/**/*.gradle.kts
            minimal/gradle.properties
      - name: Preserve the original nonvisual contracts
        run: python3 docs/visual-glass/verify_scope.py
      - name: Install Android SDK and host test tools
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          python3 scripts/prepare_smoke_ffmpeg.py "$PWD/.smoke-bin"
          echo "$PWD/.smoke-bin" >> "$GITHUB_PATH"
      - name: Build the ARM64 test APK and matching instrumentation; run original and visual tests
        run: bash minimal/gradlew -p minimal :app:assembleGithubRelease :app:testGithubDebugUnitTest :app:assembleGithubReleaseAndroidTest --no-daemon --max-workers=1 --warning-mode=none
      - name: Run the unchanged real media smoke checks
        run: |
          python3 minimal/smoke.py
          python3 minimal/verify_mp4.py minimal/app/build/generated/runtime/res/raw/ytdlp
      - name: Package the visual test build with corresponding source and notices
        run: |
          python3 minimal/package.py
          cp docs/visual-glass/APK_README.md minimal/build/distribution/README.md
          cp docs/visual-glass/REPORT.md minimal/build/distribution/LIQUID_GLASS.md
          cp docs/visual-glass/BASELINE.json minimal/build/distribution/visual-baseline.json
          cp minimal/build/visual-scope.json minimal/build/distribution/visual-scope.json
          mkdir -p minimal/build/distribution/screenshots
          cp minimal/app/build/reports/liquid-glass/*.png minimal/build/distribution/screenshots/
          cp docs/visual-glass/screenshots/*.png minimal/build/distribution/screenshots/
          python3 minimal/verify.py minimal/build/distribution/Ytdlp-G.apk
          python3 docs/visual-glass/verify_delivery.py
      - name: Verify the unchanged runtime bootstrap in the optimized APK
        run: |
          python3 minimal/dex_bootstrap.py minimal/build/distribution/Ytdlp-G.apk --report minimal/build/dex-bootstrap.json
          python3 minimal/regression_zip.py minimal/build/distribution/Ytdlp-G.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ytdlp-G-0.6.3-Liquid-Glass-Test
          path: minimal/build/distribution/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Liquid-Glass-device-tests
          path: minimal/build/device-tests/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Liquid-Glass-verification
          path: |
            minimal/app/build/reports/
            minimal/app/build/test-results/
            minimal/build/source-manifest.json
            minimal/build/visual-scope.json
            minimal/build/visual-delivery.json
            minimal/build/host-smoke.json
            minimal/build/dex-bootstrap.json
            minimal/build/zip-bootstrap-regression.json
            minimal/app/build/outputs/mapping/githubRelease/
          if-no-files-found: warn
