name: Ytdlp-G Minimal Liquid Glass
on:
  push:
    branches: [feature/minimal-liquid-glass]
    paths: ['minimal/**', '.github/workflows/minimal-glass.yml', 'scripts/prepare_runtime.py', 'full-glass/upstream.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minimal-glass-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            minimal/**/*.gradle.kts
            minimal/gradle.properties
      - name: Install Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
      - name: Prepare host integration tools
        run: |
          python3 scripts/prepare_smoke_ffmpeg.py "$PWD/.smoke-bin"
          echo "$PWD/.smoke-bin" >> "$GITHUB_PATH"
      - name: Build optimized ARM64 APK and run automated tests
        run: bash minimal/gradlew -p minimal :app:assembleGithubRelease :app:testGithubDebugUnitTest :app:assembleGithubReleaseAndroidTest --no-daemon --max-workers=1 --warning-mode=none
      - name: Run real HTTP downloads, MP3 conversion and MP4 resolution checks
        run: |
          python3 minimal/smoke.py
          python3 minimal/verify_mp4.py minimal/app/build/generated/runtime/res/raw/ytdlp
      - name: Measure paired generated-media baseline and optimized performance
        run: |
          python3 minimal/benchmark.py --mode baseline --repetitions 3
          python3 minimal/benchmark.py --mode optimized --repetitions 3
          python3 minimal/compare_benchmarks.py
      - name: Package exact APK and corresponding source
        run: |
          python3 minimal/package.py
          python3 minimal/verify.py minimal/build/distribution/Ytdlp-G.apk
      - name: Prove optimized runtime bootstrap and inspect final DEX
        run: |
          python3 minimal/dex_bootstrap.py minimal/build/distribution/Ytdlp-G.apk --report minimal/build/dex-bootstrap.json
          python3 minimal/regression_zip.py minimal/build/distribution/Ytdlp-G.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ytdlp-G-Android-Minimal
          path: minimal/build/distribution/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Android-device-tests
          path: minimal/build/device-tests/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Minimal-verification
          path: |
            minimal/app/build/reports/
            minimal/app/build/test-results/
            minimal/build/source-manifest.json
            minimal/build/host-smoke.json
            minimal/build/benchmark-*.json
            minimal/build/performance-report.md
            minimal/build/fixture-stderr.log
            minimal/build/host-process-errors.log
            minimal/build/dex-bootstrap.json
            minimal/build/zip-bootstrap-regression.json
            minimal/app/build/outputs/mapping/githubRelease/
