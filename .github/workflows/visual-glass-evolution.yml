name: Liquid Glass wallpapers and draggable capsule
on:
  push:
    branches: [visual/liquid-glass-0.6.4]
    paths: ['minimal/**', 'docs/visual-glass-064/**', '.github/workflows/visual-glass-evolution.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-glass-evolution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            minimal/**/*.gradle.kts
            minimal/gradle.properties
      - name: Verify exact preservation of the working 0.6.3 behavior
        run: python3 docs/visual-glass-064/verify_scope.py
      - name: Install SDK and unchanged media smoke tools
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          python3 scripts/prepare_smoke_ffmpeg.py "$PWD/.smoke-bin"
          echo "$PWD/.smoke-bin" >> "$GITHUB_PATH"
      - name: Build ARM64 APK and matching instrumentation; execute original and visual JVM tests
        run: bash minimal/gradlew -p minimal :app:assembleGithubRelease :app:testGithubDebugUnitTest :app:assembleGithubReleaseAndroidTest --no-daemon --max-workers=1 --warning-mode=none
      - name: Execute unchanged actual media fixture smoke checks
        run: |
          python3 minimal/smoke.py
          python3 minimal/verify_mp4.py minimal/app/build/generated/runtime/res/raw/ytdlp
      - name: Package and inspect actual APK, source, images and test identities
        run: |
          python3 minimal/package.py
          cp docs/visual-glass-064/APK_README.md minimal/build/distribution/README.md
          cp docs/visual-glass-064/REPORT.md minimal/build/distribution/LIQUID_GLASS.md
          cp docs/visual-glass-064/BASELINE.json minimal/build/distribution/visual-063-baseline.json
          cp minimal/build/visual-064-scope.json minimal/build/distribution/visual-064-scope.json
          mkdir -p minimal/build/distribution/screenshots/before minimal/build/distribution/screenshots/after
          cp docs/visual-glass-064/before/*.png minimal/build/distribution/screenshots/before/
          cp docs/visual-glass-064/after/*.png minimal/build/distribution/screenshots/after/
          cp minimal/app/build/reports/liquid-glass/*.png minimal/build/distribution/screenshots/
          python3 minimal/verify.py minimal/build/distribution/Ytdlp-G.apk
          python3 docs/visual-glass-064/verify_delivery.py
          cp minimal/build/visual-064-delivery.json minimal/build/distribution/
          python3 minimal/dex_bootstrap.py minimal/build/distribution/Ytdlp-G.apk --report minimal/build/dex-bootstrap.json
          python3 minimal/regression_zip.py minimal/build/distribution/Ytdlp-G.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ytdlp-G-0.6.4-Liquid-Glass-Test
          path: minimal/build/distribution/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Liquid-Glass-0.6.4-device-tests
          path: minimal/build/device-tests/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Liquid-Glass-0.6.4-verification
          path: |
            minimal/app/build/reports/
            minimal/app/build/test-results/
            minimal/app/build/outputs/mapping/githubRelease/
            minimal/build/source-manifest.json
            minimal/build/host-smoke.json
            minimal/build/dex-bootstrap.json
            minimal/build/zip-bootstrap-regression.json
            minimal/build/visual-064-*.json
          if-no-files-found: warn
