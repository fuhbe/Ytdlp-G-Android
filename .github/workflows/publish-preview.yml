name: Publish Android preview
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v0.1.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Ytdlp-G-Android-debug
          path: release
          run-id: 39702210036
          repository: fuhbe/Ytdlp-G-Android
          github-token: ${{ github.token }}
      - name: Check APK archive
        run: |
          test -s release/app-debug.apk
          unzip -t release/app-debug.apk > /dev/null
          mv release/app-debug.apk release/Ytdlp-G-Android-v0.1.0.apk
          sha256sum release/Ytdlp-G-Android-v0.1.0.apk
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.0 release/Ytdlp-G-Android-v0.1.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
