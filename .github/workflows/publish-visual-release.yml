name: Publish approved Android 0.6.4 without rebuilding
on:
  push:
    branches: [release/publish-0.6.4]
    paths: ['.github/workflows/publish-visual-release.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-android-v0.6.4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '39905174030'
    steps:
      - uses: actions/checkout@v4
      - name: Download the already approved packages; do not compile or sign
        run: |
          mkdir -p release-input
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > release-input/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12481096555" > release-input/main.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12480902203" > release-input/reports.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12481096555/zip" > release-input/main.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12480902203/zip" > release-input/reports.zip
      - name: Verify provenance, exact approved checksums and existing test results
        run: python3 docs/tools/publish_visual_064.py prepare release-input release-output
      - name: Check the original APK signature and package metadata
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tools_dir="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools_dir/apksigner" verify --print-certs release-output/Ytdlp-G.apk > release-output/apk-signature.txt
          "$tools_dir/aapt2" dump badging release-output/Ytdlp-G.apk > release-output/apk-package.txt
          python3 docs/tools/publish_visual_064.py check-apk release-input release-output
      - name: Create v0.6.4 on the exact approved source and publish the existing APK
        run: python3 docs/tools/publish_visual_064.py publish release-input release-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Release-0.6.4-publication-verification
          path: |
            release-output/publication.json
            release-output/release-info.json
            release-output/apk-signature.txt
            release-output/apk-package.txt
            release-output/SHA256SUMS.txt
          if-no-files-found: warn
